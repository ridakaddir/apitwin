name: npm publish

on:
  # Chained after the Release workflow (goreleaser) so we only publish to npm
  # once the GitHub release + checksums.txt + platform archives exist. A direct
  # `push: tags` trigger races release.yml and fails on a 404 for checksums.txt.
  # `release: published` would work in principle, but goreleaser creates the
  # release with the default GITHUB_TOKEN, which does not cascade-trigger other
  # workflows — so we use `workflow_run` (which is cascade-triggered regardless
  # of the token) and gate on `conclusion == success`.
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

  # Manual escape hatch for re-running a publish against an existing tag.
  # Must be dispatched against a `v*` tag ref — the version is always derived
  # from the tag, never supplied by hand.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (don't actually publish)"
        required: false
        type: boolean
        default: false

# Prevent concurrent publishes from conflicting
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Required for npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Skip if the upstream Release run failed/cancelled. workflow_dispatch
    # always runs. For workflow_run, we additionally require the triggering
    # Release to have been fired by a tag push (so we know head_branch is a
    # tag name, not a branch). Note: if release.yml ever adds non-tag-push
    # triggers (e.g. a manual workflow_dispatch for re-releasing), those
    # runs will intentionally NOT cascade here — re-publish via this
    # workflow's own workflow_dispatch against the existing tag instead.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_run triggered by a tag push, head_branch is the tag
          # name (e.g. v0.2.0-beta.14). For workflow_dispatch, github.ref is
          # already the tag ref the user dispatched against.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Use env vars instead of direct interpolation to prevent script injection.
      # See: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
      #
      # Tag resolution:
      #   workflow_run  → github.event.workflow_run.head_branch = tag name
      #   workflow_dispatch → github.ref_name (must be dispatched on a tag ref)
      - name: Determine version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            TAG_NAME="$WORKFLOW_RUN_TAG"
          else
            if [ "$DISPATCH_REF_TYPE" != "tag" ]; then
              echo "::error::workflow_dispatch must run against a tag ref, got ref_type=$DISPATCH_REF_TYPE ref_name=$DISPATCH_REF_NAME"
              exit 1
            fi
            TAG_NAME="$DISPATCH_REF_NAME"
          fi
          case "$TAG_NAME" in
            v*) ;;
            *)
              echo "::error::tag must start with 'v', got $TAG_NAME"
              exit 1
              ;;
          esac
          # Strip the leading 'v' from the tag (v0.1.0 -> 0.1.0)
          VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION (from tag $TAG_NAME)"

      - name: Determine dry-run flag
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "dry_run=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        env:
          PUBLISH_VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN_FLAG: ${{ steps.flags.outputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node npm/scripts/publish.js "$PUBLISH_VERSION" $DRY_RUN_FLAG
