name: npm publish

on:
  # Automatically triggered when a version tag is pushed (matches release.yml).
  # We trigger on the tag directly rather than on `release: published` because
  # releases created by goreleaser using GITHUB_TOKEN do not cascade-trigger
  # other workflows.
  push:
    tags:
      - "v*"

  # Manual escape hatch for re-running a publish against an existing tag.
  # Must be dispatched against a `v*` tag ref — the version is always derived
  # from the tag, never supplied by hand.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (don't actually publish)"
        required: false
        type: boolean
        default: false

# Prevent concurrent publishes from conflicting
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Required for npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Use env vars instead of direct interpolation to prevent script injection.
      # See: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
      - name: Determine version from tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::npm-publish must run against a tag ref, got ref_type=$REF_TYPE ref_name=$REF_NAME"
            exit 1
          fi
          case "$REF_NAME" in
            v*) ;;
            *)
              echo "::error::tag must start with 'v', got $REF_NAME"
              exit 1
              ;;
          esac
          # Strip the leading 'v' from the tag (v0.1.0 -> 0.1.0)
          VERSION="${REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION (from tag $REF_NAME)"

      - name: Determine dry-run flag
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "dry_run=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        env:
          PUBLISH_VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN_FLAG: ${{ steps.flags.outputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node npm/scripts/publish.js "$PUBLISH_VERSION" $DRY_RUN_FLAG
