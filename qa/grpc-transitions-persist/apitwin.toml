# QA harness: gRPC transitions + persistence
#
# Transition timeline for country lifecycle:
#   t = 0s  → "provisioning"  (2 second duration)
#   t = 2s+ → "ready"          (terminal)

########################################
# Scenarios 01-04, 09, 10, 11: baseline
########################################

# CreateCountry — append, schedules background "ready" transition
[[grpc_routes]]
match = "/geography.GeographyService/CreateCountry"
fallback = "created"

  [[grpc_routes.transitions]]
  case     = "provisioning"
  duration = 2

  [[grpc_routes.transitions]]
  case = "ready"

  [grpc_routes.cases.created]
  status   = 0
  file     = "stubs/countries/"
  persist  = true
  merge    = "append"
  key      = "code"
  defaults = "defaults/country-provisioning.json"

  [grpc_routes.cases.provisioning]
  status   = 0
  file     = "stubs/countries/{body.code}.json"
  persist  = true
  merge    = "update"
  defaults = "defaults/country-provisioning.json"

  [grpc_routes.cases.ready]
  status   = 0
  file     = "stubs/countries/{body.code}.json"
  persist  = true
  merge    = "update"
  defaults = "defaults/country-ready.json"

# GetCountry
[[grpc_routes]]
match = "/geography.GeographyService/GetCountry"
fallback = "found"

  [grpc_routes.cases.found]
  file = "stubs/countries/{body.code}.json"

# ListCountries
[[grpc_routes]]
match = "/geography.GeographyService/ListCountries"
fallback = "listed"

  [grpc_routes.cases.listed]
  file = "stubs/countries/"

# UpdateCountry
[[grpc_routes]]
match = "/geography.GeographyService/UpdateCountry"
fallback = "updated"

  [grpc_routes.cases.updated]
  status  = 0
  file    = "stubs/countries/{body.code}.json"
  persist = true
  merge   = "update"

# DeleteCountry
[[grpc_routes]]
match = "/geography.GeographyService/DeleteCountry"
fallback = "deleted"

  [grpc_routes.cases.deleted]
  status  = 0
  file    = "stubs/countries/{body.code}.json"
  persist = true
  merge   = "delete"

########################################
# Scenario 05: source field (nested body)
########################################

