########################################
# Scenario 07: transition case with missing defaults
########################################

[[grpc_routes]]
match = "/geography.GeographyService/CreateCountryMissingDefaults"
fallback = "created"

  [[grpc_routes.transitions]]
  case     = "provisioning"
  duration = 2

  [[grpc_routes.transitions]]
  case = "ready"

  [grpc_routes.cases.created]
  status   = 0
  file     = "stubs/countries_nodefault/"
  persist  = true
  merge    = "append"
  key      = "code"
  defaults = "defaults/country-provisioning.json"

  [grpc_routes.cases.provisioning]
  status  = 0
  file    = "stubs/countries_nodefault/{body.code}.json"
  persist = true
  merge   = "update"

  # ready case — persist+update but NO defaults file
  [grpc_routes.cases.ready]
  status  = 0
  file    = "stubs/countries_nodefault/{body.code}.json"
  persist = true
  merge   = "update"

[[grpc_routes]]
match = "/geography.GeographyService/GetCountryMissingDefaults"
fallback = "found"

  [grpc_routes.cases.found]
  file = "stubs/countries_nodefault/{body.code}.json"

########################################
# Scenario 08: transition case name == fallback name
########################################

[[grpc_routes]]
match = "/geography.GeographyService/CreateCountryFallbackTrap"
fallback = "ready"

  [[grpc_routes.transitions]]
  case     = "provisioning"
  duration = 2

  [[grpc_routes.transitions]]
  case = "ready"

  # fallback/create case is named "ready" (the append case)
  [grpc_routes.cases.ready]
  status   = 0
  file     = "stubs/countries_trap/"
  persist  = true
  merge    = "append"
  key      = "code"
  defaults = "defaults/country-ready.json"

  [grpc_routes.cases.provisioning]
  status   = 0
  file     = "stubs/countries_trap/{body.code}.json"
  persist  = true
  merge    = "update"
  defaults = "defaults/country-provisioning.json"

[[grpc_routes]]
match = "/geography.GeographyService/GetCountryFallbackTrap"
fallback = "found"

  [grpc_routes.cases.found]
  file = "stubs/countries_trap/{body.code}.json"

########################################
# Scenario 12: conditions + transitions
########################################

[[grpc_routes]]
match = "/geography.GeographyService/CreateCountryConditioned"
fallback = "created"

  [[grpc_routes.conditions]]
  source = "body"
  field  = "code"
  op     = "eq"
  value  = "XX"
  case   = "invalid"

  [[grpc_routes.transitions]]
  case     = "provisioning"
  duration = 2

  [[grpc_routes.transitions]]
  case = "ready"

  [grpc_routes.cases.invalid]
  status = 3  # INVALID_ARGUMENT
  json   = '{"code":"","name":"","status":"rejected","continent":""}'

  [grpc_routes.cases.created]
  status   = 0
  file     = "stubs/countries_cond/"
  persist  = true
  merge    = "append"
  key      = "code"
  defaults = "defaults/country-provisioning.json"

  [grpc_routes.cases.provisioning]
  status   = 0
  file     = "stubs/countries_cond/{body.code}.json"
  persist  = true
  merge    = "update"
  defaults = "defaults/country-provisioning.json"

  [grpc_routes.cases.ready]
  status   = 0
  file     = "stubs/countries_cond/{body.code}.json"
  persist  = true
  merge    = "update"
  defaults = "defaults/country-ready.json"

[[grpc_routes]]
match = "/geography.GeographyService/GetCountryConditioned"
fallback = "found"

  [grpc_routes.cases.found]
  file = "stubs/countries_cond/{body.code}.json"
